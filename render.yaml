# OPTIONAL self-host of the LoreGraph FastAPI backend (local dev / API).
#
# NOTE: this is NOT how the public site ships. The live site is a static
# GitHub Pages build (see web/README.md) with no live API or DB at runtime.
# Use this blueprint only if you want to run the queryable API backend
# yourself.
#
# After `render blueprint launch` (or the "New Blueprint" UI flow), Render
# will create one web service from this spec. You will be prompted to
# fill in two secret environment variables:
#
#   OPENROUTER_API_KEY     — your OpenRouter key (default provider)
#   DATABASE_URL           — Neon postgres connection string with `+asyncpg`
#                            driver, e.g.
#                            postgresql+asyncpg://USER:PWD@HOST/DB?sslmode=require
#
# The build step also runs `alembic upgrade head` against the live DB.

services:
  - type: web
    name: loregraph
    runtime: python
    plan: free
    region: oregon          # cheapest free region; change if you want
    pythonVersion: "3.11"
    buildCommand: |
      pip install -e .
      alembic upgrade head
    startCommand: |
      uvicorn loregraph.web.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # ---- secrets (you fill these in the Render UI) ----
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # ---- public configuration ----
      - key: LOREGRAPH_LLM_PROVIDER
        value: openrouter
      - key: LOREGRAPH_LLM_MODEL
        value: deepseek/deepseek-v4-pro
      - key: LOREGRAPH_LOG_LEVEL
        value: INFO
      - key: LOREGRAPH_CORS_ORIGINS
        # Lock this down to your site's origin if you expose the API.
        value: "*"
